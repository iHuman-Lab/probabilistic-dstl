# Lane change: move into the target lane past three traffic vehicles.
dynamics: double_integrator
H: 35
T_SIM: 40
seed: 0
dt: 0.2
u_max: 2.5
q_std: 0.01
x0_mean: [0.0, 0.0, 18.0, 0.0]
x0_cov_scale: 0.01
# Full-state measurements [x, y, vx, vy]; std units are [m, m, m/s, m/s].
observation:
  ego_std: [0.1, 0.1, 0.1, 0.1]
  traffic_std: [0.1, 0.1, 0.1, 0.1]

# Road and traffic configuration
road: {y_min: -1.8, y_max: 5.4, lane_divider: 1.8}
goal: {x_range: [-10.0, 150.0], y_range: [1.8, 5.4]}
ego_vehicle: {width: 4.5, height: 1.8}
traffic:
  - {name: lead, x0: 30.0, y: 0.0, speed: 14.0, width: 4.5, height: 1.8}
  - {name: target_front, x0: 38.0, y: 3.6, speed: 19.0, width: 4.5, height: 1.8}
  - {name: target_rear, x0: -12.0, y: 3.6, speed: 20.0, width: 4.5, height: 1.8}
traffic_q_std: 0.01
traffic_cov_scale: 0.01
safety_margin: {longitudinal: 0.5, lateral: 0.2}

# Task configuration
task:
  target_center: 3.6
  target_tolerance: 0.9
  start_window_seconds: [2.5, 5.0]
  dwell_seconds: 1.0
  settle_seconds: 1.0         # keep running after the dwell to show settling
  settle_lateral_speed: 0.3   # |vy| bound [m/s] once in the target lane
speed_bounds: [0.0, 25.0]
accel_bounds:
  longitudinal: [-2.5, 2.5]
  lateral: [-2.0, 2.0]

# Planner configuration
warm_starts:
  - {longitudinal: 0.8, lateral: 0.9, switch_step: 10}
planner:
  w_u: 0.002
  w_du: 0.005
  w_phi: 100.0
  max_iters: 15
  alpha: 0.95
