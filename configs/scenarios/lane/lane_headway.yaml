# B, headway: A AND G(touching the main lane -> gap to lead >= min_gap).
# Paired with lane_merge.yaml: same scene and seed, plus the rule.
dynamics: double_integrator
H: 30
T_SIM: 45
seed: 2
dt: 0.2
u_max: 2.5
q_std: 0.005
x0_mean: [0.0, 0.0, 18.0, 0.0]
x0_cov_scale: 0.01
# Full-state measurements [x, y, vx, vy]; std units are [m, m, m/s, m/s].
observation:
  ego_std: [0.1, 0.1, 0.1, 0.1]
  traffic_std: [0.1, 0.1, 0.1, 0.1]

# Road and traffic. `lead` brakes at 4 s and the cars behind follow at 5 s;
# the planner is not told: it predicts constant speeds and replans from the
# measurements.
road: {y_min: -1.8, y_max: 5.4, lane_divider: 1.8}
# Parallel on-ramp: no merging before the gore, then a 50 m full-width lane
# and a 90 m taper (about the 300 ft AASHTO parallel-entrance taper).
ramp: {gore_x: 20.0, start_x: 70.0, end_x: 160.0}
goal: {x_range: [-10.0, 200.0], y_range: [1.8, 5.4]}
ego_vehicle: {width: 4.5, height: 1.8}
traffic:
  - {name: lead, x0: 30.0, y: 3.6, speed: 14.0, width: 4.5, height: 1.8,
     brake: {at: 4.0, duration: 2.0, decel: 2.0}}
  - {name: lead_2, x0: 60.0, y: 3.6, speed: 15.0, width: 4.5, height: 1.8}
  - {name: lead_3, x0: 90.0, y: 3.6, speed: 16.0, width: 4.5, height: 1.8}
  - {name: rear, x0: -30.0, y: 3.6, speed: 14.5, width: 4.5, height: 1.8,
     brake: {at: 5.0, duration: 2.0, decel: 2.0}}
  - {name: rear_2, x0: -55.0, y: 3.6, speed: 14.5, width: 4.5, height: 1.8,
     brake: {at: 5.0, duration: 2.0, decel: 2.0}}
traffic_q_std: 0.005
# The filter allows longitudinal acceleration of this std (m/s^2, the
# brake size) so its estimate can follow a braking car; the planner still
# predicts constant velocity from that estimate.
traffic_filter_accel_std: 2.0
traffic_cov_scale: 0.01
safety_margin: {longitudinal: 0.5, lateral: 0.2}
task:
  spec: headway
  # Bumper gap to `lead` (~1.6 s at 14 m/s; 24 m leaves no time to merge).
  # Only the headway spec enforces it; the merge spec carries it so its
  # figures and table report the same gap.
  headway: {lead_vehicle: lead, min_gap: 22.0}
  target_center: 3.6
  target_tolerance: 1.2
  start_window_seconds: [2.5, 5.0]
  dwell_seconds: 1.0
  settle_seconds: 4.0         # keep driving after the dwell to see reactions
  settle_lateral_speed: 0.3   # |vy| bound [m/s] once in the target lane
speed_bounds: [0.0, 25.0]
accel_bounds:
  longitudinal: [-2.5, 2.5]
  lateral: [-2.0, 2.0]

# Planner. The first window is solved from each warm start and the best plan
# seeds the loop; here one guess: brake gently and steer into the lane.
warm_starts:
  - {longitudinal: -1.0, lateral: 0.9, switch_step: 10}
planner:
  w_u: 0.002
  w_du: 0.005
  w_phi: 100.0
  max_iters: 15
  alpha: 0.95
  warm_tail: zero     # next guess ends in zero acceleration
  tie_break: smooth   # if every iterate scores 0, keep the least bad
